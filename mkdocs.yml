site_name: "高级 WebRTC 架构：从原理到实践"
site_description: "高级 WebRTC 架构中文电子书，共 11 个部分、76 章"
site_url: https://zhaojiew10.github.io/webrtc-architecture-ebook/
repo_url: https://github.com/zhaojiew10/webrtc-architecture-ebook
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site

theme:
  name: material
  language: zh
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy

plugins:
  - search:
      lang:
        - en
        - zh

markdown_extensions:
  - admonition
  - tables
  - def_list
  - attr_list
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences

